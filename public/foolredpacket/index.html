<script type="text/javascript">
	var count = 0;
	$('.crush').click(function(e) {
		$('.audio')[0].play();
		$(this).attr("style","background:rgba(0,0,0,.5);");
		$(this).append('<img style="left:' + e.pageX + 'px;top:' + e.pageY + 'px" src="images/crush' + (count%3) + '.png" />');
		count ++;
		if(count == 3) {
			setTimeout("prompt()", 1000); 
		}
	});

	function share() {
		$(".share").show();
	}

	function remove() {
		$(".share").hide();
	}

	function prompt() {
		$('body').append('<div class="prompt">\
			<div class="cont">\
				<div class="space_30"></div>\
				<p>只是个玩笑，愚人节快乐!</p>\
				<div class="space_30"></div>\
				<a class="btn" onclick="share()">我也要整蛊</a>\
			</div>\
			<div class="bg"></div>\
		</div>');
	}
</script>
