    <style>
        .sm-box div {
            position:absolute;
        }
        .sm-box {
            position:relative;
            margin:0 auto;
            width:800px;
            height:800px;
            background-color:#000;
        }
        .sm-box .item {
            width:3px;
            height:3px;
            box-shadow:0 0 5px #f00;
        }
    </style>
</head>
<body>
<canvas id="canvas" width="600" height="400"></canvas>
<script>
    function createPoint(x, y, c) {
        var d = document.createElement("div");
        d.className = "item";
        d.style.left = x + "px";
        d.style.top = y + "px";
        d.style.backgroundColor = c;
        document.getElementById("sm-box").appendChild(d);
    }

    function drawLine(dx, dy, scale) {
        var canvas = document.getElementById("canvas");
        var context = canvas.getContext("2d");

        context.beginPath();

        var t, theta, a = 5, b = 8;
        var x, y;
        for(t = 0; t < 200; t += 0.1) {
            theta = t;
            x = scale * ((a + b) * Math.cos(theta) - b * Math.cos((a / b + 1) * theta)) + dx;
            y = scale * ((a + b) * Math.sin(theta) - b * Math.sin((a / b + 1) * theta)) + dy;

            context.lineTo(x, y);
        }

        context.stroke();
        context.closePath();
    }
    drawLine(300, 200, 7);
</script>
</body>
