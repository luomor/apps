		<meta charset="utf-8">
        <style type="text/css">
        </style>
        <script type="text/javascript">
            function draw() {
                var canvas = document.getElementById("canvas");
                var context = canvas.getContext("2d");

                context.beginPath();
                context.moveTo(0, 100);

                var x = 0;
                var y = 0;
                for(var i = 1 ; i < 200 ; i += 0.1) {
                    x = i * 20;
                    y = Math.sin(i) * 20 + 100;
                    context.lineTo(x, y);
                }

                context.stroke();
                context.closePath();
            }
        </script>
    </head>
    <body>
        <canvas id="canvas" width="400" height="400"></canvas>
        <script type="text/javascript">
            draw();
        </script>
    </body>
